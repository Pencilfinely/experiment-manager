name: Build draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, matching VERSION
        required: true
        default: v0.3.0-rc.4
permissions:
  contents: write
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Validate requested version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python -c "import os; from scripts.build_release import VERSION; assert os.environ['RELEASE_TAG']=='v'+VERSION"
      - run: python -m unittest discover -s tests -t . -v
      - run: node tests/test_timing_ui.js
      - name: Validate native desktop and updater
        shell: pwsh
        run: |
          ./scripts/test_desktop.ps1
          ./scripts/test_icons.ps1
          ./scripts/test_browser_icons.ps1
          ./scripts/test_updates.ps1
      - run: python scripts/build_release.py --download-python
      - name: Create draft with application ZIPs and native Windows installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem dist/*/* -File | ForEach-Object { $_.FullName }
          $notes = 'docs/RELEASE-' + $env:RELEASE_TAG.TrimStart('v') + '.md'
          gh release create $env:RELEASE_TAG @assets --verify-tag --draft --prerelease --title "Experiment Manager $env:RELEASE_TAG" --notes-file $notes
